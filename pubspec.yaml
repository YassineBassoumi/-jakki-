name: jakki
description: "Jakki Tunisie - Tunisian Mahbousseh variant of backgammon in Flutter"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Persistence (saved games, settings, stats)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Localization
  intl: ^0.20.2

  # UI / animation
  flutter_animate: ^4.5.2

  # Audio (dice / pin / win sound effects)
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
