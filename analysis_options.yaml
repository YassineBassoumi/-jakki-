# Lints for the Jakki Tunisie app. Extends the `flutter_lints` defaults
# with a few stricter rules — see `docs/PLAN.md` Milestone 1.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing return types and similar laziness as errors.
    always_declare_return_types: error
    avoid_dynamic_calls: error
    prefer_const_constructors: warning
    prefer_const_constructors_in_immutables: warning
    prefer_const_declarations: warning
    prefer_const_literals_to_create_immutables: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - unawaited_futures
    - use_string_buffers
